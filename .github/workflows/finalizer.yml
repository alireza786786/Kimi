name: Run Finalizer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run finalizer
        working-directory: Kimi
        run: |
          python finalizer.py

      - name: Update README summary
        working-directory: Kimi
        run: |
          echo "## Latest Finalizer Run" > summary.md
          echo "✅ Workflow executed successfully on $(date)" >> summary.md
          echo "" >> summary.md
          echo "Generated files:" >> summary.md
          ls output >> summary.md || echo "No output files found"
          cat summary.md >> ../README.md

      - name: Commit and push results
        working-directory: Kimi
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Update output and README summary" || echo "No changes"
          git push || echo "Nothing to push"

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "finalizer-$(date +'%Y%m%d-%H%M%S')"
          name: "Finalizer Run $(date)"
          body: "Automated release of finalizer output files."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

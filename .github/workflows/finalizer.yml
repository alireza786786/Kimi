name: Run Finalizer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Run finalizer
        run: |
          python finalizer.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Update output files" || echo "No changes"
          git push || echo "Nothing to push"

      - name: Create release
        if: ${{ hashFiles('output/country/*') != '' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "finalizer-$(date +'%Y%m%d-%H%M%S')"
          name: "Finalizer Run $(date)"
          body: "Automated release containing only output files."
          files: |
            output/country/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Generate All 8 Guards

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate 8 Guard Files
        run: |
          python3 -c '
          import os

          os.makedirs(".github/workflows", exist_ok=True)

          expr_bot = "${" + "{" + " secrets.BOT_TOKEN " + "}" + "}"
          expr_chat = "${" + "{" + " secrets.CHAT_ID " + "}" + "}"
          expr_src = "${" + "{" + " secrets.SOURCES_JSON " + "}" + "}"

          for i in range(1, 9):
              content = f"""name: GUARD {i} Engine

          on:
            schedule:
              - cron: "0 */3 * * *"
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: guard{i}_job
            cancel-in-progress: false

          jobs:
            run-guard{i}:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - name: Checkout Repo
                  uses: actions/checkout@v4

                - name: Setup Python
                  uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"

                - name: Install Dependencies
                  run: pip install -q -r requirements.txt

                - name: Execute guard{i} Engine
                  env:
                    BOT_TOKEN: {expr_bot}
                    CHAT_ID: {expr_chat}
                    SOURCES_JSON: {expr_src}
                  run: python guard{i}.py

                - name: Commit Updated Subscription
                  run: |
                    git config user.name "Guard-Bot"
                    git config user.email "guard@github.com"
                    git add subscription_guard{i}*.txt || true
                    if ! git diff --cached --quiet; then
                      git commit -m "Auto Update guard{i}: $(date -u +\'%Y-%m-%d %H:%M\')"
                      git push
                    fi
          """
              with open(f".github/workflows/guard{i}.yml", "w", encoding="utf-8") as f:
                  f.write(content)
          '

      - name: Commit and Push
        run: |
          git config user.name "Guard Setup Bot"
          git config user.email "setup@github.com"
          git add .github/workflows/guard*.yml
          git commit -m "Auto-generate 8 guard workflow files"
          git push
